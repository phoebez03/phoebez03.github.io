<svg xmlns="http://www.w3.org/2000/svg" width="360" height="346" viewBox="0 0 360 346" role="img" aria-labelledby="title">
  <title id="title">Two different questions with the same response pattern</title>
  <rect width="360" height="346" rx="18" fill="#f1f6fc"/>
  <rect x="15" y="15" width="330" height="141" rx="13" fill="#fff" stroke="#d8e0ea"/>
  <text x="33" y="40" fill="#0066cc" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">QUESTION 01</text>
  <text x="33" y="70" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="19" font-weight="700">Identify what happened</text>
  <rect x="33" y="87" width="294" height="49" rx="9" fill="#eaf3ff" stroke="#a7c9f1"/>
  <text x="47" y="107" fill="#0066cc" font-family="Arial, sans-serif" font-size="12" font-weight="700">ANSWER PATTERN</text>
  <rect x="47" y="117" width="189" height="6" rx="3" fill="#91bbec"/>
  <path d="M180 162v19" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round"/>
  <path d="m173 174 7 8 7-8" fill="none" stroke="#0066cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="15" y="190" width="330" height="141" rx="13" fill="#fff" stroke="#d8e0ea"/>
  <text x="33" y="215" fill="#0066cc" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">QUESTION 02</text>
  <text x="33" y="245" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="19" font-weight="700">Explain why it happened</text>
  <rect x="33" y="262" width="294" height="49" rx="9" fill="#eaf3ff" stroke="#a7c9f1"/>
  <text x="47" y="282" fill="#0066cc" font-family="Arial, sans-serif" font-size="12" font-weight="700">SAME ANSWER PATTERN</text>
  <rect x="47" y="292" width="189" height="6" rx="3" fill="#91bbec"/>
  <circle cx="312" cy="287" r="10" fill="#fff0da"/>
  <text x="312" y="292" text-anchor="middle" fill="#a66010" font-family="Arial, sans-serif" font-size="15" font-weight="700">!</text>
</svg>
