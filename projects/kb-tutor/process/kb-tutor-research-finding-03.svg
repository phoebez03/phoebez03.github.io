  <text x="637" y="190" text-anchor="middle" fill="#8793a1" font-family="Arial, sans-serif" font-size="11" font-weight="600">evidence</text>
  <path d="M315 68C394 8 474 23 525 75" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
