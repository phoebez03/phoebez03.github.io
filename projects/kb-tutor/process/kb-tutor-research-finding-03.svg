  <circle cx="71" cy="159" r="3" fill="#fff"/>
  <rect x="91" y="154" width="180" height="9" rx="4.5" fill="#8dbbf0"/>
  <circle cx="71" cy="207" r="8" fill="#fff" stroke="#b5c1cf" stroke-width="2"/>
  <rect x="91" y="202" width="151" height="9" rx="4.5" fill="#cdd7e3"/>
  <rect x="440" y="128" width="246" height="98" rx="14" fill="#fff" stroke="#d7e0ea" stroke-dasharray="6 6"/>
  <text x="462" y="157" fill="#6e7783" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".6">REASONING CHECK</text>
