<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title">
  <title id="title">Different prompts, repeated answer pattern</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef3f9"/>
    </linearGradient>
  </defs>
  <rect width="720" height="280" rx="20" fill="url(#paper)"/>
  <rect x="24" y="24" width="302" height="230" rx="15" fill="#fff" stroke="#d8e0ea"/>
  <rect x="394" y="24" width="302" height="230" rx="15" fill="#fff" stroke="#d8e0ea"/>
  <text x="46" y="55" fill="#0066cc" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">QUESTION 01</text>
  <text x="416" y="55" fill="#0066cc" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">QUESTION 02</text>
  <text x="46" y="89" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="21" font-weight="700">Identify what happened</text>
  <text x="416" y="89" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="21" font-weight="700">Explain why it happened</text>
  <rect x="46" y="105" width="211" height="7" rx="3.5" fill="#d5dde7"/>
  <rect x="416" y="105" width="213" height="7" rx="3.5" fill="#d5dde7"/>
  <rect x="46" y="135" width="258" height="88" rx="12" fill="#eaf3ff" stroke="#a7c9f1"/>
  <rect x="416" y="135" width="258" height="88" rx="12" fill="#eaf3ff" stroke="#a7c9f1"/>
  <text x="63" y="159" fill="#0066cc" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".8">RESPONSE</text>
  <text x="433" y="159" fill="#0066cc" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".8">RESPONSE</text>
  <rect x="63" y="174" width="178" height="8" rx="4" fill="#86b6ef"/>
  <rect x="63" y="191" width="218" height="7" rx="3.5" fill="#b7d3f3"/>
  <rect x="433" y="174" width="178" height="8" rx="4" fill="#86b6ef"/>
  <rect x="433" y="191" width="218" height="7" rx="3.5" fill="#b7d3f3"/>
  <circle cx="54" cy="238" r="9" fill="#dff3e8"/>
  <path d="m50 238 3 3 5-6" fill="none" stroke="#29865b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="71" y="243" fill="#5a6c7f" font-family="Arial, sans-serif" font-size="12">Matches the request</text>
  <circle cx="424" cy="238" r="9" fill="#fff0da"/>
  <text x="424" y="243" text-anchor="middle" fill="#b86a14" font-family="Arial, sans-serif" font-size="14" font-weight="700">!</text>
  <text x="441" y="243" fill="#875727" font-family="Arial, sans-serif" font-size="12">Explanation still missing</text>
  <path d="M338 176h38" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round"/>
  <path d="m368 168 9 8-9 8" fill="none" stroke="#0066cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
